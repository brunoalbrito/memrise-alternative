name: Semantic Release (macOS)

on:
  push:
    branches:
      - main
      - develop
      - '*.release'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job 1: Detect Version & Determine Release Scope
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.semantic.outputs.new-version }}
      version-type: ${{ steps.semantic.outputs.version-type }}
      is-prerelease: ${{ steps.semantic.outputs.is-prerelease }}
      should-release: ${{ steps.check-commits.outputs.should-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for versionable commits
        id: check-commits
        run: |
          # Check if any commits since last tag have feat:, fix:, or BREAKING CHANGE
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
          else
            COMMITS=$(git log ${LAST_TAG}...HEAD --pretty=%B)
            if echo "$COMMITS" | grep -qE "^feat:|^fix:|BREAKING CHANGE"; then
              echo "should-release=true" >> $GITHUB_OUTPUT
            else
              echo "should-release=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Detect semantic version
        id: semantic
        if: steps.check-commits.outputs.should-release == 'true'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log ${LAST_TAG}...HEAD --pretty=%B)
          
          # Determine version type (major > minor > patch)
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|^feat!:|^fix!:"; then
            echo "version-type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -q "^feat:"; then
            echo "version-type=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -q "^fix:"; then
            echo "version-type=patch" >> $GITHUB_OUTPUT
          else
            echo "version-type=none" >> $GITHUB_OUTPUT
          fi
          
          # Determine if pre-release based on branch
          if [ "$GITHUB_REF" == "refs/heads/main" ]; then
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          fi
          
          # For demo: generate version (simplified)
          echo "new-version=v1.0.0" >> $GITHUB_OUTPUT

  # Job 2: Build macOS Installer (runs only if should-release=true)
  build-macos:
    needs: detect-version
    if: needs.detect-version.outputs.should-release == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript compilation
        run: pnpm run build

      - name: Build macOS installer
        run: pnpm run package
        env:
          CI: true

      - name: Verify build artifacts
        run: |
          ls -lah release/mac-universal/
          if [ ! -f release/mac-universal/*.dmg ]; then
            echo "❌ DMG file not found in release/mac-universal/"
            exit 1
          fi
          echo "✓ Build artifacts verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/mac-universal/
          retention-days: 5

  # Job 3: Create GitHub Release with Assets
  create-release:
    needs: [detect-version, build-macos]
    if: needs.detect-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm & semantic-release
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release/mac-universal/

      - name: Configure Git for semantic-release
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Create release with semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: success()
        run: |
          echo "✅ Release created successfully"
          echo "📦 Version: ${{ needs.detect-version.outputs.new-version }}"
          echo "🔗 Release: ${{ github.server_url }}/${{ github.repository }}/releases"

  # Job 4: Cleanup on failure
  cleanup-on-failure:
    needs: [detect-version, create-release]
    if: failure() && needs.detect-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete orphaned tag if exists
        continue-on-error: true
        run: |
          TAG="${{ needs.detect-version.outputs.new-version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Deleting orphaned tag: $TAG"
            git push origin --delete "$TAG" 2>/dev/null || true
          fi

      - name: Delete orphaned release if exists
        continue-on-error: true
        run: |
          TAG="${{ needs.detect-version.outputs.new-version }}"
          echo "Cleanup complete for: $TAG"

      - name: Report cleanup
        run: |
          echo "⚠️ Release workflow failed"
          echo "🧹 Orphaned artifacts cleaned up"
