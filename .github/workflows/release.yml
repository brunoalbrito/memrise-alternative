name: Semantic Release (macOS)

on:
  push:
    branches:
      - main
      - develop
      - '*.release'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job 1: Detect Version & Determine Release Scope
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.semantic.outputs.new-version }}
      version-type: ${{ steps.semantic.outputs.version-type }}
      is-prerelease: ${{ steps.semantic.outputs.is-prerelease }}
      should-release: ${{ steps.check-commits.outputs.should-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for versionable commits
        id: check-commits
        run: |
          # Check if any commits since last tag have feat:, fix:, or BREAKING CHANGE
          LAST_TAG=$(git tag -l | sort -V | tail -1)

          # If no tags exist, check all commits; otherwise check commits since tag
          if [ -z "$LAST_TAG" ]; then
            # First release - check all commits
            COMMITS=$(git log --pretty=%B)
            RANGE_DESC="all commits"
          else
            # Check commits since last tag
            COMMITS=$(git log ${LAST_TAG}...HEAD --pretty=%B)
            RANGE_DESC="commits since ${LAST_TAG}"
          fi

          # Check for versionable commit types
          if echo "$COMMITS" | grep -qE "^feat:|^fix:|BREAKING CHANGE"; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "✅ Found versionable commits ($RANGE_DESC)"
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "⏭️  No versionable commits ($RANGE_DESC) - skipping release"
          fi

      - name: Calculate next semantic version
        id: semantic
        if: steps.check-commits.outputs.should-release == 'true'
        run: |
          # Get last tag
          LAST_TAG=$(git tag -l | sort -V | tail -1)
          IS_FIRST_RELEASE=false

          if [ -z "$LAST_TAG" ]; then
            # First release - use v0.0.0
            IS_FIRST_RELEASE=true
            NEW_VERSION="v0.0.0"
            VERSION_TYPE="initial"
            echo "First release detected - using v0.0.0"
          else
            echo "Last tag: $LAST_TAG"

            # Get commits since last tag
            COMMITS=$(git log ${LAST_TAG}...HEAD --pretty=%B)

            # Parse current version
            MAJOR=$(echo $LAST_TAG | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo $LAST_TAG | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo $LAST_TAG | sed 's/^v//' | cut -d. -f3 | cut -d- -f1)

            # Determine version type (major > minor > patch)
            if echo "$COMMITS" | grep -qE "BREAKING CHANGE|^feat!:|^fix!:"; then
              VERSION_TYPE="major"
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
            elif echo "$COMMITS" | grep -q "^feat:"; then
              VERSION_TYPE="minor"
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
            elif echo "$COMMITS" | grep -q "^fix:"; then
              VERSION_TYPE="patch"
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
            else
              VERSION_TYPE="none"
            fi

            # Build new version tag
            if [ "$VERSION_TYPE" != "none" ]; then
              NEW_VERSION="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
            else
              NEW_VERSION=$LAST_TAG
            fi
          fi

          # Determine if pre-release based on branch
          if [ "$GITHUB_REF" == "refs/heads/main" ]; then
            IS_PRERELEASE="false"
          else
            IS_PRERELEASE="true"
            if [ "$IS_FIRST_RELEASE" == "false" ]; then
              NEW_VERSION="${NEW_VERSION}-beta.1"
            fi
          fi

          echo "version-type=$VERSION_TYPE" >> $GITHUB_OUTPUT
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "is-prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "last-tag=$LAST_TAG" >> $GITHUB_OUTPUT

          echo "✓ Version calculation:"
          echo "  Last tag: ${LAST_TAG:-none}"
          echo "  Version type: $VERSION_TYPE"
          echo "  New version: $NEW_VERSION"
          echo "  Pre-release: $IS_PRERELEASE"

  # Job 2: Build macOS Installer (runs only if should-release=true)
  build-macos:
    needs: detect-version
    if: needs.detect-version.outputs.should-release == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript compilation
        run: pnpm run build

      - name: Build macOS installer
        run: pnpm build && electron-builder --publish=never
        env:
          CI: true

      - name: Verify build artifacts
        run: |
          ls -lah release/mac-universal/
          if [ ! -f release/mac-universal/*.dmg ]; then
            echo "❌ DMG file not found in release/mac-universal/"
            exit 1
          fi
          echo "✓ Build artifacts verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/mac-universal/
          retention-days: 5

  # Job 3: Create GitHub Release with Assets
  create-release:
    needs: [detect-version, build-macos]
    if: needs.detect-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release/mac-universal/

      - name: Configure Git for release
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG="${{ needs.detect-version.outputs.last-tag }}"
          NEW_VERSION="${{ needs.detect-version.outputs.new-version }}"

          if [ -z "$LAST_TAG" ] || [ "$LAST_TAG" == "v0.0.0" ]; then
            CHANGELOG="Initial release"
          else
            CHANGELOG=$(git log ${LAST_TAG}...HEAD --pretty=format:"- %s (%h)" | grep -E "^- (feat|fix|perf):" || echo "- Release $NEW_VERSION")
          fi

          # Create CHANGELOG.md entry
          {
            echo "## $NEW_VERSION ($(date -u +'%Y-%m-%d'))"
            echo ""
            echo "$CHANGELOG"
            echo ""
            if [ -f CHANGELOG.md ]; then
              tail -n +1 CHANGELOG.md
            fi
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          cat CHANGELOG.md

      - name: Create Git tag
        run: |
          NEW_VERSION="${{ needs.detect-version.outputs.new-version }}"
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.detect-version.outputs.new-version }}
          name: "Release ${{ needs.detect-version.outputs.new-version }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ needs.detect-version.outputs.is-prerelease == 'true' }}
          files: |
            release/mac-universal/*.dmg
            release/mac-universal/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: success()
        run: |
          echo "✅ Release created successfully!"
          echo ""
          echo "📦 Version: ${{ needs.detect-version.outputs.new-version }}"
          echo "🏷️  Type: ${{ needs.detect-version.outputs.version-type }}"
          echo "🔓 Pre-release: ${{ needs.detect-version.outputs.is-prerelease }}"
          echo "📥 Installer: release/mac-universal/"
          echo ""
          echo "🔗 Download: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.detect-version.outputs.new-version }}"

  # Job 4: Cleanup on failure
  cleanup-on-failure:
    needs: [detect-version, create-release]
    if: failure() && needs.detect-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete orphaned tag if exists
        continue-on-error: true
        run: |
          TAG="${{ needs.detect-version.outputs.new-version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Deleting orphaned tag: $TAG"
            git push origin --delete "$TAG" 2>/dev/null || true
          fi

      - name: Delete orphaned release if exists
        continue-on-error: true
        run: |
          TAG="${{ needs.detect-version.outputs.new-version }}"
          echo "Cleanup complete for: $TAG"

      - name: Report cleanup
        run: |
          echo "⚠️ Release workflow failed"
          echo "🧹 Orphaned artifacts cleaned up"
